k into gears.',sci:'Lets you research upgrades and unlock buildings (press T).',airport:'Drops bombs on enemy groups every 12 s.',recycler:'Turns junk back into metal. Powered.',mint:'Presses metal and pearl into coins. Powered.',transmitter:'Passive. Contact range with friendly and neutral bases grows to 220 and their gifts arrive twice as often.',eatery:'Turns food into snacks. Cottages can only be built within 160 of an Eatery.',cottage:'Eats snacks to create a new unit (cap 40). Needs a nearby Eatery.',deprob:'Sacrifices itself to destroy the strongest tough enemy (Brute) within 260.',pacifier:'Burns pills to lower the euphoria of friendly bases within 200. At full euphoria a friendly base sends candy instead of its usual gift.',softener:'Turns candy into 2 random minerals (metal, pearl, meat, bone, gum or gear).',repair:'Heals every node in range while powered.',wall:'Cheap, tough decoy. Put it on the perimeter to soak up damage.'};
const SYS=[['Basics','Welcome','<p>Nodefield is an economy-and-defense game on an infinite map. You grow a network of nodes outward from your Core. Units haul resources along the links, production buildings turn them into new materials, and every few minutes raiders attack. Expand, keep the economy ahead of the raids, and protect your Core.</p>'],
['Basics','Building rules','<ul><li>A new node must be within 110 of an existing node and at least 26 from any other.</li><li>Placing creates a <b>blueprint</b>; a Construction unit pays the cost and builds it in about 3 s.</li><li>Mines must sit on a deposit and each deposit hosts one mine.</li><li>Hover a node and press <b>X</b> to destroy it (Houses and Palaces only by bombs after 10 s).</li><li>On limited maps you cannot build outside the border.</li></ul>'],
['Basics','Units and roles','<p>Units have four roles, set with the +/− panel or the Auto button:</p><ul><li><b>Transport</b> carries resources between the Core, producers and consumers.</li><li><b>Production</b> operates powered buildings, turrets, lasers and palaces.</li><li><b>Construction</b> builds blueprints.</li><li><b>Defense</b> fights enemies directly.</li></ul><p>New units come from Houses, monuments, friendly factions and drones.</p>'],
['Basics','Power','<p>Powered buildings need a Power Station slot. Each station powers 5 buildings but only while the Core holds batteries; every 20 s each station burns 1 battery. Windmills make batteries. A red outline on a node means it has no power.</p>'],
['Basics','Economy chains','<ul><li>Mine → metal · Factory → pearl (+junk) · Farm → meat</li><li>Meat Grinder: meat + metal → food</li><li>Laboratory: food + pearl → gum</li><li>Smeltery: metal + bone → gear · Eatery: food → snack · Science Center: research (T)</li><li>Ammunition: metal → ammo · Bomb Workshop: metal + bone → bomb</li><li>Garbage Factory: junk → gear · Recycler: junk → metal</li><li>Minting Factory: metal + pearl → coin</li><li>Friendly bases at full euphoria give candy · Pacifier (pill) lowers euphoria · Softener (candy) slows raiders</li></ul>'],
['Systems','Raids and timing','<p>Raids come in waves. Size grows with the wave number and difficulty, enemy health grows 5% per wave, and tougher enemy types unlock later. You get a warning 10 s before each wave. Every raid you fully repel adds 10 s to the gap before the next one, up to a maximum of 5 minutes. Groups can come from a random direction or from a hostile faction base near your network.</p><p><b>Raid timing</b> (Settings) adds or removes seconds between raids in every mode. Skirmish difficulty adds its own: Easy +60 s, Hard −10 s, Brutal −20 s. The minimum gap is 15 s.</p>'],
['Systems','Game modes','<ul><li><b>Campaign</b> '+LV.length+' goal-based levels: '+LV.map(l=>l.n+' ('+l.g+')').join('; ')+'.</li><li><b>Sandbox</b> starts with 300 of everything.</li><li><b>Skirmish</b> adjustable difficulty, raid sizes, deposit frequency, raid timing and map size.</li><li><b>Map editor</b> make and play your own maps.</li></ul>'],
['Systems','Deposits and monuments','<p>Gold rings are deposits; mines extract from them. Purple diamonds (or custom shapes) are monuments: build within 60 of one to discover it for a reward of units and resources.</p>'],
['Systems','Limited maps','<p>Maps can be Infinite or limited (Tiny, Small, Medium, Large). A limited map has a dashed red border: you cannot build outside it, deposits stay inside, and raids spawn at its edge.</p>'],
['Factions','How factions work','<p>Faction bases are scattered across the map, drawn as a coloured shape with a name. There are <b>50 official factions</b> plus endless <b>procedural</b> ones with generated names.</p><ul><li><b>Friendly</b> (hexagon): build within 80 of a base to make contact. They send 3 units and then regular gifts that grow each wave.</li><li><b>Neutral</b> (square): trade only, with smaller gifts.</li><li><b>Hostile</b> (triangle): expanding near them provokes an immediate raid, and later raids may start from their base with their colour on the raiders.</li></ul>'],
['Controls','Navigation','<p>The <b>minimap</b> shows nodes, deposits, monuments, factions and enemies; click or drag it to move the camera. If your Core goes off screen a <b>locator arrow</b> points back to it, and <b>H</b> or the ⌂ button jumps home. Zoom with the wheel or the + / − buttons (zooming out has no limit). Zoomed out far enough, a <b>political map</b> shows faction territories and your colony. <b>V</b> or the 🗺 button fits the whole map on screen; press it again to return. Both can be turned off in Settings.</p>'],
['Controls','Editors','<p>The <b>Map Editor</b> places deposits and monuments, sets map size and procedural deposits, and saves maps. The <b>Resource &amp; Monument Editor</b> creates custom resources and monuments with a shape or emoji, name (emoji allowed), colour and rewards.</p>'],
